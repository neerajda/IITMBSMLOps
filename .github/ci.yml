name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc[cml] scikit-learn pandas pytest

      - name: Configure DVC remote and pull data/model
        run: |
          dvc remote modify --local storage.auth false || true
          dvc pull

      - name: Run pytest
        run: pytest tests --junitxml=report.xml

      - name: Run CML to comment report on PR
        if: github.event_name == 'pull_request'
        uses: iterative/cml@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: cml-send-comment report.xml
