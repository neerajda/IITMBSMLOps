name: CI/CD for Iris API

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: tactile-talon-451815-a3
  REGION: us-central1
  REPO_NAME: my-repo
  CLUSTER_NAME: iris-cluster
  CLUSTER_ZONE: us-central1-a

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up gcloud
      uses: google-github-actions/setup-gcloud@v2
      with:
        project_id: ${{ env.PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true

    - name: Configure Docker
      run: gcloud auth configure-docker $REGION-docker.pkg.dev

    - name: Build & Push Docker Image
      run: |
        docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/iris-api:latest ./app
        docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/iris-api:latest

    - name: Get GKE Credentials
      run: gcloud container clusters get-credentials $CLUSTER_NAME --zone $CLUSTER_ZONE --project $PROJECT_ID

    - name: Deploy to GKE
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
        kubectl apply -f k8s/hpa.yaml
