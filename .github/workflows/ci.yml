name: IRIS ML Pipeline CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 🪣 Checkout your repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🐍 Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 📦 Install dependencies (pinned to avoid resolution-too-deep)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "numpy>=1.21.0,<1.27" \
                      "pandas>=1.3.0,<2.1" \
                      "scikit-learn>=1.0,<1.5" \
                      "pytest>=7.0,<8.3" \
                      "joblib>=1.1,<2.0" \
                      "dvc>=3.0,<4.0" \
                      --use-deprecated=legacy-resolver

      # 💾 Pull data and model from DVC
      - name: Pull DVC-tracked data and model
        run: |
          dvc pull || echo "No DVC data/model found, skipping..."

      # 🧪 Run tests
      - name: Run Pytest
        run: pytest tests/ --junitxml=report.xml || true

      # 📤 Upload test report as an artifact
      - name: Upload Pytest report
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.xml

      # ⚙️ Setup CML (correct way — from GitHub)
      - name: Setup CML
        uses: iterative/setup-cml@v1
        with:
          version: 'latest'

      # 🧾 Post test summary as PR comment
      - name: Comment report on PR using CML
        if: github.event_name == 'pull_request'
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 🧪 IRIS Pipeline Test Summary" > cml_report.md
          echo "" >> cml_report.md
          echo "✅ **Branch:** $GITHUB_REF" >> cml_report.md
          echo "📊 **Pytest results uploaded as artifact.**" >> cml_report.md
          echo "" >> cml_report.md
          cml comment create --file cml_report.md
