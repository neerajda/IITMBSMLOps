name: CI Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest scikit-learn pandas dvc cml joblib

      - name: Pull DVC-tracked data and model
        run: |
          dvc pull || echo "No DVC data found, skipping..."

      - name: Run Pytest
        run: |
          pytest tests/ --junitxml=report.xml || echo "Tests failed!"

      - name: Upload Pytest report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.xml

      - name: Comment report on PR using CML
        if: github.event_name == 'pull_request'
        uses: iterative/cml@v0.9.20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: cml comment create --file report.xml
